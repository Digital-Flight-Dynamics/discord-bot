name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun install --frozen-lockfile
        working-directory: webui
      - run: bun run check
        working-directory: webui
      - run: bun run build
        working-directory: webui
      - run: docker build -f webui/Dockerfile -t dfd-atc .
